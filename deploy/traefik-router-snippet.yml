# EXEMPLO — cole dentro de `http.routers` no dynamic.yml do seu Traefik e
# troque o Host pelo seu domínio.
    daily-web-app:
      rule: "Host(`dashboard.exemplo.com`)"
      priority: 200
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: daily-web-app
